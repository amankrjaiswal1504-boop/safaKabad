<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SafaKabad</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif;
        background: radial-gradient(40rem 24rem at 80% -10%, rgba(34, 150, 108, 0.35), transparent 60%), #0e1f1a;
        color: #fff;
        text-align: center;
      }
      .card { max-width: 340px; }
      .logo { width: 72px; height: 72px; border-radius: 20px; background: #0f6247; display: grid; place-items: center; margin: 0 auto 20px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6); }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #c7d2cd; line-height: 1.5; margin: 0 0 24px; }
      button {
        border: 1px solid rgba(217, 182, 106, 0.6);
        background: linear-gradient(90deg, #11523c, #1f8a63);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 999px;
      }
      .ne { margin-top: 18px; font-size: 13px; color: #9fb1a9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="44" height="44">
          <path d="M27.5 15.5a9 9 0 1 0 1.4 8.2" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
          <path d="M29.6 10.5v6.2h-6.2" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="20" cy="20" r="3" fill="#E9D9B4" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>SafaKabad needs an internet connection. Check your mobile data or Wi-Fi and try again.</p>
      <button type="button" onclick="location.href='https://safakabad.com'">Try again</button>
      <div class="ne">इन्टरनेट जडान छैन। फेरि प्रयास गर्नुहोस्।</div>
    </div>
  </body>
</html>
